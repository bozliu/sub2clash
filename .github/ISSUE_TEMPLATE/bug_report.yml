name: Bug report
description: Report a reproducible problem in Sub2Clash
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, deployment mode, and version
  - type: textarea
    id: notes
    attributes:
      label: Privacy / security notes
      description: Use redacted values only. Never paste live subscription links or secrets.
